<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Finanzas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container my-5">
        <!-- Título Principal -->
        <h1 class="text-center text-uppercase mb-5 titulo-principal">Control de Finanzas</h1>

        <!-- Sección Superior: Registro de Gasto -->
        <div class="row mb-4 justify-content-center">
            <div class="col-md-8">
                <div class="p-4 shadow-sm rounded">
                    <h5 class="mb-3 text-muted">Registre su gasto</h5>
                    <form id="formulario-gasto">
                        <div class="mb-3">
                            <input type="number" id="valor" class="form-control" placeholder="Valor">
                        </div>

                        <div class="mb-3">
                            <input type="text" id="descripcion" class="form-control" placeholder="Descripción">
                        </div>
                        <div class="col-md-4">
                            <select id="categoria" class="form-select">
                                <option selected>Categoría</option>
                                <option value="alimentacion">Comida</option>
                                <option value="transporte">Transporte</option>
                                <option value="entretenimiento">Entretenimiento</option>
                                <option value="salud">Servicios</option>
                                <option value="otros">Otros</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-3">Agregar Gasto</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Sección Inferior: Tres Columnas -->
        <div class="row g-4">

            <!-- Columna 1: Gastos de hoy -->
            <div class="col-md-3">
                <div class="bloque-finanzas">
                    <h4 class="mb-4">Gastos de hoy</h4>
                    <ul class="list-unstyled lista-gastos">
                        <li>• Almuerzo: $15,000</li>
                        <li>• Transporte: $3,000</li>
                    </ul>
                </div>
            </div>

            <!-- Columna 2: Filtre su categoría -->
            <div class="col-md-3">
                <div class="bloque-finanzas">
                    <h4 class="mb-4">Filtre su categoría</h4>
                    <select class="form-select input-categoria">
                        <option selected>Todas las categorías</option>
                        <option value="alimentacion">Comida</option>
                        <option value="transporte">Transporte</option>
                        <option value="entretenimiento">Entretenimiento</option>
                        <option value="salud">Servicios</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
            </div>

            <!-- Columna 3: Gastos General -->
            <div class="col-md-6">
                <div class="bloque-finanzas">
                    <h2 class="text-center display-6 fw-normal mb-3 titulo-gastos">Gastos</h2>

                    <!-- Fila de gasto registrado -->
                    <div id="listaGastos"></div>
                </div>
            </div>

        </div>
    </div>

    
    <script src="./script.js"></script>
    <script src="https://jsdelivr.net"></script>
</body>

</html>

</html>
